version: 'v1'
services:
  mongodb: 
    image: mongo
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes: 
      - mongodb_data:/data/db

  dewages-network-backend:
    build: ./backend/
    container_name: dewages-network-backend
    ports:
      - "8000:8000"
    depends_on:
      - mongodb
    environment:
      - MONGO_CONNECTION_STRING=mongodb://mongodb:27017/mydb
      - PROGRAM_ID=4f9fP5Aoz7Tcu7Z5J7WWhTRUa757QnK91JvpM1Zyg7BM
      - JWT_SECRET=qwertyuiopasdfghjklzxcvbnm 
      - FRONTEND_DOMAIN=http://localhost:5173
      - PORT=8000
      - RPC_URL=https://devnet.helius-rpc.com/?api-key=2ac5b659-b819-400e-990c-628e1b2582e9


volumes:
  mongodb_data:

    